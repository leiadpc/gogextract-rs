[package]
name = "gogextract"
version = "0.2.2"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
ctrlc = "3.4"
indicatif = "0.17"
memmap2 = "0.9"
rayon = "1.10"
zip = "2.0"
eframe  = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui    = { version = "0.31", optional = true }
rfd     = { version = "0.15", optional = true }

[features]
default = ["gui"]
gui = ["eframe", "egui", "rfd"]

# Optional: Add release profile optimizations for maximum extraction speed
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# ---------------------------------------------------------------------------
# To build without the GUI (e.g. for a headless server):
#   cargo build --no-default-features
#
# To build with the GUI (default):
#   cargo build
# ---------------------------------------------------------------------------
